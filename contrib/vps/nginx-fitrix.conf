# For a VPS where nginx already terminates HTTPS. Save as /etc/nginx/sites-available/fitrix and link it
# into sites-enabled. Replace YOUR_DOMAIN, then get the certificate with:
#   certbot --nginx -d YOUR_DOMAIN
# (certbot adds the 443 block and the redirect for you; the block below is the plain-HTTP start.)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Photos and videos of custom exercises: the app allows up to 40 MB, nginx's default is 1 MB.
    client_max_body_size 48m;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
